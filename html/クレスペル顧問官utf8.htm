<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クレスペル顧問官</title>
  <style>
    :root{--bg:#f7f4ef;--text:#171717;--muted:#6f6a63;--line:rgba(23,23,23,.16)}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#f7f4ef 0%,#efe9df 100%);color:var(--text);font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;line-height:2.05;letter-spacing:.035em}
    .wrap{width:min(820px,calc(100% - 34px));margin:0 auto;padding:56px 0 72px}
    header{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:32px 0 28px;margin-bottom:34px}
    h1{margin:0;font-size:clamp(1.7rem,5vw,2.8rem);font-weight:500;line-height:1.35;letter-spacing:.08em}
    .author{margin:.8rem 0 0;color:var(--muted);font-size:.95rem;letter-spacing:.08em}
    main{background:rgba(255,255,255,.28);border:1px solid var(--line);padding:clamp(24px,5vw,54px);box-shadow:0 22px 70px rgba(0,0,0,.06)}
    p{margin:0 0 1.55em;text-align:justify;text-indent:1em}
    p:first-child{text-indent:0}
    nav{margin-top:42px;padding-top:22px;border-top:1px solid var(--line);font-size:.92rem}
    a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
    a:hover{opacity:.65}.loading{color:var(--muted)}
    @media (max-width:640px){body{line-height:1.9}.wrap{width:min(100% - 26px,820px);padding-top:36px}main{padding:22px 18px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header><h1>クレスペル顧問官</h1><div class="author">Ｅ・Ｔ・Ａ・ホフマン</div></header>
    <main>
      <div id="content" class="loading">読み込み中...</div>
      <nav><a href="../index.html">Index</a></nav>
    </main>
  </div>
  <script>
    const files = Array.from({length:13}, (_, i) => `krespel-councillor.files/part-${String(i + 1).padStart(2, "0")}.txt`);
    (async () => {
      const text = (await Promise.all(files.map(async file => {
        const response = await fetch(file);
        if (!response.ok) throw new Error(file);
        return await response.text();
      }))).join("");
      const target = document.getElementById("content");
      target.textContent = "";
      target.classList.remove("loading");
      for (const block of text.split(/\n\n+/)) {
        if (!block.trim()) continue;
        const p = document.createElement("p");
        p.textContent = block;
        target.appendChild(p);
      }
    })().catch(() => {
      document.getElementById("content").textContent = "本文を読み込めませんでした。";
    });
  </script>
</body>
</html>
