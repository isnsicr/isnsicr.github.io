<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クレスペル顧問官</title>
<style>
html, body {
  margin: 0;
  padding: 0;
}

body {
  writing-mode: vertical-rl;
  -webkit-writing-mode: vertical-rl;
  text-orientation: mixed;
  -webkit-text-orientation: mixed;
  line-break: strict;
  word-break: normal;
  font-family: "BIZ UD明朝 Medium", "Yu Mincho", serif;
  background: white;
  color: black;
}

div.WordSection1 {
  writing-mode: vertical-rl;
  height: 29em;
  width: auto;
  overflow: auto;
  padding-top: 1em;
  padding-right: 1em;
  padding-bottom: 1em;
  padding-left: 5em;
  layout-grid: 18.0pt;
}

p, p.MsoNormal, li.MsoNormal, div.MsoNormal {
  margin: 0mm;
  text-align: justify;
  text-justify: inter-ideograph;
  text-indent: 8.5pt;
  line-height: 15pt !important;
  mso-line-height-rule: exactly;
  layout-grid-mode: char;
  font-size: 8.5pt;
  mso-bidi-font-size: 12.0pt;
  font-family: "BIZ UD明朝 Medium", "Yu Mincho", serif;
}

p.title-line {
  text-indent: 25.5pt;
  mso-char-indent-count: 3.0;
}

p.author-gap-1 {
  margin-top: 0mm;
  margin-right: 10.5pt;
  margin-bottom: 8.5pt !important;
  margin-left: 0mm;
  text-align: right;
}

#content > p {
  text-indent: 8.5pt;
  margin: 0mm;
}

p[align="right"] {
  text-align: start;
}

.index-link {
  position: fixed;
  top: 8pt;
  left: 8pt;
  writing-mode: horizontal-tb;
  font-size: 8.5pt;
  font-family: "BIZ UD明朝 Medium", "Yu Mincho", serif;
  line-height: 15pt;
  background: white;
  padding: 0 4pt;
  z-index: 10;
}

.index-link a {
  color: black;
  text-decoration: none;
}

.loading {
  color: #555;
}
</style>
</head>
<body lang="JA" style="tab-interval:42.0pt;word-wrap:break-word;line-break:strict">
<div class="index-link"><a href="../index.html">Index</a></div>
<div class="WordSection1" style="layout-grid:18.0pt">

<p class="MsoNormal title-line"><span>クレスペル顧問官</span></p>
<p class="MsoNormal author-gap-1" align="right"><span>Ｅ・Ｔ・Ａ・ホフマン</span></p>
<div id="content" class="loading"><p>読み込み中...</p></div>

</div>
<script>
const files = [
  "クレスペル顧問官.files/part-01.html",
  "クレスペル顧問官.files/part-02.html",
  "クレスペル顧問官.files/part-03.html",
  "クレスペル顧問官.files/part-04.html",
  "クレスペル顧問官.files/part-05.html",
  "クレスペル顧問官.files/part-06.html"
];

async function loadText(){
  const target = document.getElementById("content");
  target.textContent = "";
  target.classList.remove("loading");
  for (const file of files){
    const response = await fetch(file);
    if (!response.ok) throw new Error(file);
    const source = await response.text();
    const holder = document.createElement("div");
    holder.innerHTML = source;
    for (const p of holder.querySelectorAll("p")){
      p.className = "MsoNormal";
      target.appendChild(p);
    }
  }
}

loadText().catch(function(){
  document.getElementById("content").innerHTML = "<p>本文を読み込めませんでした。</p>";
});
</script>
</body>
</html>
