<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<title>Chess PWA Reset</title>
<style>
:root{color-scheme:light;--bg:#f3f4f6;--card:#fff;--text:#17191c;--muted:#68717a;--border:#ccd2d8;--accent:#2867b2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:40px 18px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
h1{font-size:1.2rem;margin:0 0 10px}p{color:var(--muted);line-height:1.6;margin:.5rem 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}
button{margin-top:14px;width:100%;min-height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700}
.status{margin-top:14px;padding:10px;border-radius:9px;background:#eef1f3;color:var(--text);font-size:.85rem;white-space:pre-wrap}
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>Chess PWA をリセット</h1>
    <p><code>/chess/</code> のService Worker登録と、<code>chess-</code> で始まるキャッシュを削除してから最新版を開きます。</p>
    <button id="reset">リセットして最新版を開く</button>
    <div id="status" class="status">準備完了</div>
  </section>
</main>
<script>
(function(){
'use strict';
var status=document.getElementById('status');
var button=document.getElementById('reset');

function log(s){status.textContent=s}

async function resetChessPwa(){
  button.disabled=true;
  try{
    log('Service Workerを解除しています…');
    if('serviceWorker' in navigator){
      var regs=await navigator.serviceWorker.getRegistrations();
      var removed=0;
      for(var i=0;i<regs.length;i++){
        var path=new URL(regs[i].scope).pathname;
        if(path.startsWith('/chess/')){
          if(await regs[i].unregister())removed++;
        }
      }
      log('Service Worker解除: '+removed+'件\nキャッシュを削除しています…');
    }

    var deleted=0;
    if('caches' in window){
      var keys=await caches.keys();
      for(var j=0;j<keys.length;j++){
        if(keys[j].startsWith('chess-')){
          if(await caches.delete(keys[j]))deleted++;
        }
      }
    }

    log('Service Workerとキャッシュを解除しました。\n最新版へ移動します…');
    location.replace('/chess/?reset='+Date.now());
  }catch(e){
    button.disabled=false;
    log('リセットに失敗しました: '+(e&&e.message?e.message:String(e)));
  }
}

button.addEventListener('click',resetChessPwa);
setTimeout(resetChessPwa,250);
})();
</script>
</body>
</html>
